[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evs-life-satisfaction"
version = "0.1.1"
description = "Reproducible EVS life-satisfaction profiling, modelling and prediction"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Filip Karika"}]
dependencies = [
  "numpy>=2.0,<3", "scipy>=1.14,<2", "pandas>=2.2,<4",
  "scikit-learn>=1.7,<2", "pyarrow==25.0.1", "joblib>=1.4,<2",
]

[project.optional-dependencies]
reports = ["matplotlib>=3.9,<4", "reportlab>=4.2,<6", "pypdf>=5,<8"]
dev = ["build>=1.2,<2", "nbformat>=5.10,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]

[project.scripts]
evs-predict = "evs_model.cli:predict_main"
evs-train = "evs_model.cli:train_main"
evs-infer = "evs_model.cli:infer_main"

[tool.setuptools.packages.find]
where = ["src"]
