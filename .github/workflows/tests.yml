name: Package and synthetic-data tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the package
        run: |
          python -m pip install -r requirements-model-lock.txt
          python -m pip install --no-deps .
      - name: Run existing and model tests without survey data
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Check the released model on synthetic inputs
        run: evs-predict --input examples/respondents.csv --output /tmp/evs-predictions.csv
      - name: Verify saved Part II predictions without private training data
        run: python scripts/verify_production.py
